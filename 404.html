<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Yetzer Lab</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23ffc9a3'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='20' fill='%231a1206'%3EY%3C/text%3E%3C/svg%3E">
  <meta name="color-scheme" content="dark light">
  <script>
    // GitHub Pages muestra esta página para cualquier dirección que no existe,
    // a cualquier profundidad; por eso no usa rutas relativas.
    (function () {
      try {
        var saved = localStorage.getItem('yl-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}

      var VIEWS = ['inicio', 'expresa', 'suena', 'comparte', 'juega', 'forja', 'creemos-juntos', 'se-parte'];
      var ALIASES = { 'juegos': 'juega', 'privacidad': 'privacidad.html' };

      // Devuelve la raíz del sitio y, si la dirección apunta a una sección
      // conocida (p. ej. /juega/ en vez de /#juega), a dónde redirigir.
      function resolve(hostname, pathname) {
        var parts = pathname.split('/').filter(Boolean);
        // En usuario.github.io el primer tramo es el nombre del repositorio;
        // con dominio propio el sitio vive en la raíz.
        var project = /\.github\.io$/i.test(hostname) && parts.length > 0;
        var base = project ? '/' + parts[0] + '/' : '/';
        var seg = parts[project ? 1 : 0] || '';
        try { seg = decodeURIComponent(seg); } catch (e) {}
        seg = seg.toLowerCase().replace(/\.html?$/, '');
        if (Object.prototype.hasOwnProperty.call(ALIASES, seg)) seg = ALIASES[seg];
        var target = null;
        if (VIEWS.indexOf(seg) >= 0) target = base + '#' + seg;
        else if (/\.html$/.test(seg) && base + seg !== pathname) target = base + seg;
        return { base: base, target: target };
      }

      var found = resolve(location.hostname, location.pathname);
      document.documentElement.setAttribute('data-base', found.base);
      if (found.target) location.replace(found.target);
    })();
  </script>
  <style>
    :root {
      --bg: #070d1f; --border: #24325c;
      --text: #ffffff; --text-muted: #b9c2dc;
      --accent: #ffc9a3; --accent-strong: #ffb380; --on-accent: #1a1206; --focus: #ffe0c7;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #fbf6f0; --border: #e4d6c6;
      --text: #0b1430; --text-muted: #4a5573;
      --accent: #a8501c; --accent-strong: #8c3f12; --on-accent: #ffffff; --focus: #a8501c;
      color-scheme: light;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px 20px;
      display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: var(--font); line-height: 1.6; text-align: center;
    }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    main { max-width: 520px; }
    .brand {
      display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px;
      font-family: var(--font-display); font-size: 1.25rem; font-weight: 700;
    }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--accent); color: var(--on-accent);
      display: grid; place-items: center; font-size: .95rem;
    }
    h1 { margin: 0 0 10px; font-family: var(--font-display); font-size: clamp(2rem, 7vw, 3rem); line-height: 1.1; }
    p { margin: 0 0 28px; color: var(--text-muted); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 46px; padding: 0 22px; border-radius: 999px;
      background: var(--accent); color: var(--on-accent); border: 1px solid var(--accent);
      font-weight: 600; text-decoration: none;
    }
    .btn:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark" aria-hidden="true">Y</span><span>Yetzer Lab</span></div>
    <h1>Página no encontrada</h1>
    <p lang="en">Page not found</p>
    <!-- El enlace fijo sirve sin JavaScript; el script lo ajusta a la raíz real del sitio. -->
    <a class="btn" id="home" href="/yetzer-lab/">Volver al inicio <span lang="en">&nbsp;·&nbsp;Back to home</span></a>
  </main>
  <script>
    (function () {
      var base = document.documentElement.getAttribute('data-base');
      if (base) document.getElementById('home').setAttribute('href', base);
    })();
  </script>
</body>
</html>
